<!doctype html>
<html>
<body>
  <iframe
    id="nba"
    src="https://id.nba.com/voting"
    width="900"
    height="600">
  </iframe>

  <br>

  <button id="test">Send benign redirectRequest</button>

  <script>
    document.querySelector("#test").onclick = () => {
      const frame = document.querySelector("#nba");

      frame.contentWindow.postMessage(
        {
          identifier: "redirectRequest",
          url: "https://example.com/"
        },
        "https://id.nba.com"
      );
    };
  </script>
</body>
</html>
